name: Playwright + Cucumber Tests (Daily Schedule)

on:
  schedule:
    # At 10:00 AM IST every day (Mon–Fri)
    # GitHub Actions works in UTC → 10:00 AM IST = 4:30 AM UTC
    - cron: '30 4 * * 1-5'

  workflow_dispatch: # allows manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright + Cucumber Tests
        run: npx cucumber-js --format html:reports/report.html

      - name: Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: cucumber-playwright-report
          path: reports/
